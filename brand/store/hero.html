<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>rostdav-mfa hero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
body{margin:0}
.hero{width:1600px;height:800px;position:relative;overflow:hidden;color:#F4EFE8;font-family:'Space Grotesk',sans-serif;background:radial-gradient(42% 52% at 8% 10%,rgba(194,73,29,.55),transparent 70%),radial-gradient(36% 46% at 96% 4%,rgba(232,120,58,.30),transparent 70%),radial-gradient(48% 56% at 70% 100%,rgba(122,42,18,.7),transparent 70%),#0B0C10}
.copy{position:absolute;left:96px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center;gap:28px}
.word{font-size:96px;font-weight:700;letter-spacing:-4px;line-height:1}
.word i{font-style:normal;color:#E8783A}
.claim{font:500 18px 'JetBrains Mono',monospace;letter-spacing:4px;text-transform:uppercase;color:#C2BAB1}
.sub{font-size:26px;line-height:1.4;color:#C2BAB1;max-width:560px}
.phone{position:absolute;width:300px;border-radius:44px;border:6px solid #1B1D24;box-shadow:0 40px 80px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.12);overflow:hidden;background:#0B0C10}
.phone img{display:block;width:100%}
</style></head><body>
<div class="hero">
<div class="copy">
<svg width="120" height="120" viewBox="0 0 512 512" aria-label="rostdav-mfa icon"><image href="../logo/icon.svg" width="512" height="512"/></svg>
<div class="word"><span>rost</span><i>dav</i><span>-mfa</span></div>
<div class="claim">Your security. Your control.</div>
<div class="sub">Approve sign-ins to your own Rostdav server with a tap and your fingerprint.</div>
</div>
<div class="phone" style="left:780px;top:90px;transform:rotate(-4deg)"><img src="../../media/07-settings-dark.png" alt="Settings"></div>
<div class="phone" style="left:1010px;top:50px;z-index:2"><img src="../../media/09-approve-dark.png" alt="Approve a sign-in"></div>
<div class="phone" style="left:1240px;top:120px;transform:rotate(4deg);z-index:1"><img src="../../media/05-overview-request-dark.png" alt="Overview"></div>
</div>
</body></html>
