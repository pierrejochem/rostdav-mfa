<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>rostdav-mfa store frame</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap">
<style>
body{margin:0}
.f{width:1080px;height:1920px;position:relative;overflow:hidden;color:#F4EFE8;font-family:'Space Grotesk',sans-serif;background:radial-gradient(50% 36% at 10% 6%,rgba(194,73,29,.6),transparent 70%),radial-gradient(60% 40% at 96% 98%,rgba(122,42,18,.75),transparent 70%),#0B0C10;display:flex;flex-direction:column;align-items:center}
h1{margin:120px 80px 0;font-size:84px;line-height:1.08;letter-spacing:-2px;text-align:center}
h1 i{font-style:normal;color:#E8783A}
.phone{margin-top:90px;width:700px;border-radius:70px;border:12px solid #1B1D24;box-shadow:0 60px 120px rgba(0,0,0,.65),inset 0 0 0 2px rgba(255,255,255,.12);overflow:hidden}
.phone img{display:block;width:100%}
</style></head><body>
<div class="f"><h1 id="t"></h1><div class="phone"><img id="i" alt=""></div></div>
<script>
var q=new URLSearchParams(location.search);
document.getElementById('i').src=q.get('img');
var words=(q.get('caption')||'').split('|');
document.getElementById('t').innerHTML=words[0]+(words[1]?' <i>'+words[1]+'</i>':'');
</script></body></html>
