[package]
name = "rustmfa-contract"
version = "0.1.0"
edition = "2021"
description = "Shared RustMFA signing formats, verification, and test vectors"

[dependencies]
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "std"] }
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_yaml = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }
